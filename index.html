<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoQuote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; }
        .glass-panel { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom scrollbar for SaaS theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F5F6F8; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
        /* Inputs autofill fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #111827 !important;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E50914',
                            redHover: '#FF2E2E',
                            dark: '#000000',
                            darkSurface: '#111111'
                        },
                        primary: '#E50914',
                        secondary: '#000000',
                        bgMain: '#FFFFFF',
                        card: '#FFFFFF',
                        textPrimary: '#000000',
                        textSecondary: '#6B7280',
                        borderDivider: '#E5E7EB'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-900 antialiased h-screen flex flex-col bg-[#F5F6F8]">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform transition-transform duration-300 translate-x-full">
        <div id="toast-message" class="bg-white border-l-4 shadow-lg rounded px-4 py-3 min-w-[300px]"></div>
    </div>

    <!-- Install App Modal -->
    <div id="install-modal" onclick="App.hideInstallPopup()" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
        <div onclick="event.stopPropagation()" class="w-full max-w-lg rounded-3xl bg-card border border-borderDivider shadow-2xl p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-xl font-semibold text-textPrimary">Install InvoQuote</h2>
                    <p class="mt-2 text-textSecondary text-sm">Choose the correct installer for your device.</p>
                </div>
                <button onclick="App.hideInstallPopup()" class="text-textSecondary hover:text-textPrimary">✕</button>
            </div>
            <div class="mt-6 grid gap-4">
                <div id="install-mobile-panel" class="rounded-2xl border border-borderDivider bg-card p-4">
                    <p class="text-textPrimary font-medium">Mobile Install</p>
                    <p class="text-textSecondary text-sm mt-1">Download the Android APK and install it on your phone.</p>
                    <a id="install-apk-link" href="android/app/build/outputs/apk/debug/app-debug.apk" download class="mt-4 inline-flex w-full justify-center rounded-xl bg-brand-red px-4 py-3 text-sm font-semibold text-white hover:bg-brand-redHover">Download APK</a>
                </div>
                <div id="install-desktop-panel" class="rounded-2xl border border-borderDivider bg-card p-4">
                    <p class="text-textPrimary font-medium">Desktop Install</p>
                    <p class="text-textSecondary text-sm mt-1">Download the desktop Electron installer for Windows.</p>
                    <a id="install-desktop-link" href="dist/Quotation System Setup 1.0.0.exe" class="mt-4 inline-flex w-full justify-center rounded-xl bg-brand-red px-4 py-3 text-sm font-semibold text-white hover:bg-brand-redHover">Download Desktop App</a>
                </div>
            </div>
            <div class="mt-6 text-right">
                <button onclick="App.hideInstallPopup()" class="rounded-full border border-borderDivider bg-card px-4 py-2 text-sm text-textPrimary hover:bg-bgMain">Close</button>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="flex-grow flex flex-col h-full overflow-hidden">
        <!-- Content gets injected here by app.js -->
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/login.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/documents.js"></script>
    <script src="js/pages/document-form.js"></script>
    <script src="js/pages/customers.js"></script>
    <script src="js/pages/customer-form.js"></script>
    <script src="js/pages/products.js"></script>
    <script src="js/pages/product-form.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/preview.js"></script>
    <script src="js/pages/verify.js"></script>
    <script src="js/pages/forgot.js"></script>
    <script src="js/pages/reset.js"></script>
    <script src="js/pages/contact.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
